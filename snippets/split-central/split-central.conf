CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# DYA Studio runtime pointing-device configuration
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# DYA Studio BLE profile / pairing management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# DYA Studio idle / sleep timeout controls
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# DYA Studio runtime macro / combo editing
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y

# Stable behavior IDs for persisted runtime bindings
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y

# Runtime macro storage and custom RPC payload sizes
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# Stability-first split BLE baseline.
# Keep a fixed 15 ms split interval instead of dynamically changing it.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=30
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# Extra headroom for bursty pointing-device reports over BLE.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=40
