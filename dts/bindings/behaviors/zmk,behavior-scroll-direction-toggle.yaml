description: Toggle vertical scroll direction in RAM for runtime input processors

compatible: "zmk,behavior-scroll-direction-toggle"

include: zero_param.yaml

properties:
  processor-name:
    type: string
    required: true
    description: Primary runtime input processor name

  secondary-processor-name:
    type: string
    required: true
    description: Secondary runtime input processor name kept in sync
